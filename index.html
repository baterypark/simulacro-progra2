<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulacro CS6003</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Claude-style: warm paper, clay accent, serif headings. Layout: Home = grid of 15 topic tiles; topic view = stacked question sheets, each with its own stopwatch. */
:root{
  --bg:#faf9f5; --surface:#f5f4ee; --ink:#141413; --muted:#5e5d59; --line:#e8e6dc;
  --accent:#c96442; --accent-ink:#ffffff; --code-bg:#faf9f5; --amber:#b86a00;
  --ok:#2f7d4f; --ok-bg:#e8f2ea; --bad:#b4463a; --bad-bg:#f8e6e2; --warn-bg:#f8efdc;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"DM Sans", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15204B; --surface:#1d2a5c; --ink:#eef0f7; --muted:#a8b0d2; --line:#33427c;
  --accent:#e8825f; --accent-ink:#15204B; --code-bg:#111a3e; --amber:#ffb547;
  --ok:#6fd6a5; --ok-bg:#183f45; --bad:#ff8a8a; --bad-bg:#4a2443; --warn-bg:#3e3a3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15204B; --surface:#1d2a5c; --ink:#eef0f7; --muted:#a8b0d2; --line:#33427c;
  --accent:#e8825f; --accent-ink:#15204B; --code-bg:#111a3e; --amber:#ffb547;
  --ok:#6fd6a5; --ok-bg:#183f45; --bad:#ff8a8a; --bad-bg:#4a2443; --warn-bg:#3e3a3a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--display);font-weight:500!important;text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(32px,5vw,40px);font-weight:700;line-height:1.1}
h2{line-height:1.15}
h1 .sub{white-space:nowrap}
@media (max-width:600px){h1 .dot{display:none} h1 .sub{display:block;color:var(--accent);font-size:.78em;margin-top:6px}}
h2{font-size:clamp(22px,4vw,28px);font-weight:700}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:62ch;margin:8px 0 0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* home */
.home-head{display:flex;flex-direction:column;gap:6px;margin-bottom:24px}
.settings{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 26px;color:var(--muted);font-size:14px}
.settings select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:10px;text-align:left;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:border-color .15s, transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile .num{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}
.tile .name{font-family:var(--display);font-weight:500;font-size:18px;line-height:1.25}
.tile .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:auto}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

/* section */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.back{background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:7px 14px;border-radius:999px}
.score{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;display:flex;gap:14px;flex-wrap:wrap}
.score b{color:var(--ok)} .score s{color:var(--bad);text-decoration:none;font-weight:600}
.ghost{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px}
.qs{display:flex;flex-direction:column;gap:18px}
.lvhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:8px 0 14px}
.qs+.lvhead{margin-top:36px}
.lvhead h3{margin:0;font-family:var(--display);font-weight:500;font-size:21px}
.lvhead span{color:var(--muted);font-size:13.5px}
.lv{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:3px}
.lv0{background:var(--ok-bg);color:var(--ok)}
.lv1{background:var(--bad-bg);color:var(--accent)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{font-family:var(--display);font-weight:600;font-size:18px}
.qnum small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.clock{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:8px;background:var(--code-bg);border:1px solid var(--line)}
.clock.low{color:var(--bad);border-color:var(--bad)}
.clock.idle{color:var(--muted)}
.codebox{position:relative;min-width:0}
pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55;tab-size:4}
.q.locked pre{filter:blur(6px);user-select:none}
.q.locked .opts{opacity:.4}
.cover{position:absolute;inset:0;display:grid;place-items:center}
.start{background:var(--accent);color:var(--accent-ink);border:none;padding:11px 22px;border-radius:999px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:14px;min-width:0}
.opt .k{font-weight:600;color:var(--accent)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere;font-family:var(--body)}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb{border-radius:9px;padding:10px 12px;font-size:14px}
.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)} .fb.time{background:var(--warn-bg)}
.fb strong{display:block;margin-bottom:2px}
.fb code{font-family:var(--mono);font-size:13px}
.retry{align-self:flex-start;background:none;border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:8px;font-size:13px}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
</style>

</head>

  stopAll();
  const opts=lv=>[30,45,60,90,120,180,300].map(s=>`<option value="${s}" ${s==secs[lv]?"selected":""}>${fmt(s)} min</option>`).join("");
  app.innerHTML=`<div class="home-head"><h1>Simulacro por temas<span class="dot"> • </span><span class="sub">Programación II</span></h1>
  <p class="lead">Elige un tema. Cada tema tiene 10 preguntas básicas y 10 de desafío. Cada pregunta empieza bloqueada: pulsa <b>Iniciar</b> para ver el código y arrancar su propio cronómetro. Si se acaba el tiempo, cuenta como incorrecta.</p></div>
  <div class="settings"><span>Tiempo por pregunta:</span><label for="s0">básica</label><select id="s0">${opts(0)}</select><label for="s1">desafío</label><select id="s1">${opts(1)}</select><span>· 20 preguntas por tema (10 + 10)</span></div>
  <div class="grid">${TOPICS.map((t,i)=>{const qs=qsOf(i);const done=qs.filter(q=>res[q[0]]).length;const ok=qs.filter(q=>res[q[0]]&&res[q[0]].ok).length;
    return `<button class="tile" data-t="${i}"><span class="num">TEMA ${String(i+1).padStart(2,"0")}</span><span class="name">${esc(t)}</span>
    <span class="bar"><i style="width:${done/qs.length*100}%"></i></span><span class="meta"><span>${done}/${qs.length} respondidas</span><span>${done?ok+" correctas":""}</span></span></button>`}).join("")}</div>`;
  [0,1].forEach(lv=>app.querySelector("#s"+lv).onchange=e=>{secs[lv]=+e.target.value;store.set("cs6003-secs2",secs)});
  app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{location.hash="tema-"+(+b.dataset.t+1);});
  window.scrollTo(0,0);
}

function section(t){
  stopAll();
  const qs=qsOf(t);
  app.innerHTML=`<div class="top"><button class="back" id="back">← Temas</button><span class="score" id="score"></span><button class="ghost" id="reset">Reiniciar tema</button></div>
  <span class="eyebrow">Tema ${String(t+1).padStart(2,"0")}</span>
  <h2 style="margin:4px 0 20px">${esc(TOPICS[t])}</h2>
  ${[0,1].map(lv=>`<div class="lvhead"><h3>${lv?"Desafío":"Básicas"}</h3><span>${lv?"Preguntas de mayor dificultad":"Preguntas de repaso"} · ${fmt(secs[lv])} c/u</span></div>
  <div class="qs">${qs.filter(q=>q[5]===lv).map(q=>`<article class="q" id="q${q[0]}"></article>`).join("")}</div>`).join("")}`;
  app.querySelector("#back").onclick=()=>{location.hash=""};
  app.querySelector("#reset").onclick=()=>{qs.forEach(q=>delete res[q[0]]);store.set("cs6003-res",res);section(t)};
  qs.forEach(q=>renderQ(q,t));
  score(t);
  window.scrollTo(0,0);
}
function score(t){
  const qs=qsOf(t);const done=qs.filter(q=>res[q[0]]);const ok=done.filter(q=>res[q[0]].ok).length;
  const el=document.getElementById("score");if(el)el.innerHTML=`<span><b>${ok}</b> bien</span><span><s>${done.length-ok}</s> mal</span><span>${qs.length-done.length} pendientes</span>`;
}
function renderQ(q,t,state){
  const [n,code,opts,ans,ex,lv]=q;const sec=secs[lv];const el=document.getElementById("q"+n);const r=res[n];
  state=state||(r?"done":"locked");
  el.className="q"+(state==="locked"?" locked":"");
  const clock=state==="done"?(r.pick<0?"0:00":`✓ ${fmt(r.time)}`):fmt(state==="run"?timers[n].left:sec);
  let fb="";
  if(state==="done"){
    fb=r.pick<0?`<div class="fb time"><strong>Se acabó el tiempo. Era la ${L[ans]}.</strong>${esc(ex)}</div>`:
      r.ok?`<div class="fb ok"><strong>¡Correcto! Era la ${L[ans]}.</strong>${esc(ex)}</div>`:
      `<div class="fb bad"><strong>Incorrecto. Marcaste la ${L[r.pick]}; era la ${L[ans]}.</strong>${esc(ex)}</div>`;
  }
  el.innerHTML=`<div class="qhead"><span class="qnum">Pregunta ${n}<span class="lv lv${lv}">${LV[lv]}</span><small>¿Qué imprime?</small></span>
    <span class="clock ${state==="locked"?"idle":""}" id="c${n}">${clock}</span></div>
    <div class="codebox"><pre>${esc(code)}</pre>${state==="locked"?`<div class="cover"><button class="start">Iniciar · ${fmt(sec)}</button></div>`:""}</div>
    <div class="opts">${opts.map((o,i)=>{let c="";if(state==="done"){if(i===ans)c="right";else if(i===r.pick)c="wrong";}
      return `<button class="opt ${c}" data-i="${i}" ${state!=="run"?"disabled":""}><span class="k">${L[i]})</span><span>${esc(o)}</span></button>`}).join("")}</div>
    ${fb}${state==="done"?`<button class="retry">Intentar de nuevo</button>`:""}`;
  if(state==="locked")el.querySelector(".start").onclick=()=>start(q,t);
  if(state==="run")el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>finish(q,t,+b.dataset.i));
  if(state==="done")el.querySelector(".retry").onclick=()=>{delete res[n];store.set("cs6003-res",res);renderQ(q,t);score(t)};
}
function start(q,t){
  const n=q[0];timers[n]={left:secs[q[5]],total:secs[q[5]],id:null};
  renderQ(q,t,"run");
  timers[n].id=setInterval(()=>{
    const tm=timers[n];if(!tm)return;tm.left--;
    const c=document.getElementById("c"+n);
    if(c){c.textContent=fmt(Math.max(tm.left,0));c.classList.toggle("low",tm.left<=15)}
    if(tm.left<=0)finish(q,t,-1);
  },1000);
}
function finish(q,t,pick){
  const n=q[0];const tm=timers[n];if(!tm)return;clearInterval(tm.id);
  res[n]={pick,ok:pick===q[3],time:tm.total-tm.left};delete timers[n];
  store.set("cs6003-res",res);renderQ(q,t);score(t);
}
function route(){const m=location.hash.match(/^#tema-(\d+)$/);const t=m?+m[1]-1:-1;if(t>=0&&t<15)section(t);else home();}
window.addEventListener("hashchange",route);
route();
</script>
